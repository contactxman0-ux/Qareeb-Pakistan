// ── haversine distance ────────────────────────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

  var fetchNearbyPlaces=async function(lat,lng,category){
    try{
      var rad=10000;
      var osmFilter=OSM_CAT[category]||'"amenity"="restaurant"';
      var filters=osmFilter.split('|');
      var unionParts=filters.map(function(f){
        return 'node['+f+'](around:'+rad+','+lat+','+lng+');way['+f+'](around:'+rad+','+lat+','+lng+');';
      }).join('');
      var query='[out:json][timeout:25];('+unionParts+');out body center 20;';
      var res=await fetch('https://overpass-api.de/api/interpreter',{
        method:'POST',
        body:'data='+encodeURIComponent(query),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}
      });
      var data=await res.json();
      if(!data||!data.elements||data.elements.length===0)return [];
      var seen={};
      var results=[];
      for(var i=0;i<data.elements.length;i++){
        var el=data.elements[i];
        var name=el.tags&&el.tags.name;
        if(!name)continue;
        if(seen[name])continue;
        seen[name]=true;
        var elat=el.lat||(el.center&&el.center.lat)||lat;
        var elng=el.lon||(el.center&&el.center.lon)||lng;
        var dist=+haversine(lat,lng,elat,elng).toFixed(1);
        var phone=el.tags['contact:phone']||el.tags.phone||el.tags['phone']||'';
        var addr=el.tags['addr:street']||el.tags['addr:city']||el.tags['is_in']||'';
        results.push({
          id:'osm_'+el.id,
          name:name,
          cat:category,
          loc:addr||name,
          lat:elat,
          lng:elng,
          dist:dist,
          rating:0,
          reviews:0,
          open:true,
          icon:CAT_ICONS2[category]||'📍',
          trend:false,
          ver:true,
          bg:CAT_BG[category]||'#16a34a',
          lt:CAT_LT[category]||'#f0fdf4',
          ph:phone,
          hrs:'N/A',
          desc:name+(addr?' — '+addr:''),
          wait:'N/A',
          osmData:true
        });
        if(results.length>=15)break;
      }
      return results;
    }catch(e){console.log('OSM error:',e);return [];}
  };

  var loadGooglePlaces=async function(lat,lng){
    setBusy(true);
    try{
      var cats=['restaurants','clinics','pharmacy','dhabas','grocery','mosque','petrol','atm','salons'];
      var allPlaces=[];
      var places0=await fetchNearbyPlaces(lat,lng,cats[0]);
      var places1=await fetchNearbyPlaces(lat,lng,cats[1]);
      var places2=await fetchNearbyPlaces(lat,lng,cats[2]);
      allPlaces=allPlaces.concat(places0,places1,places2);
      setPL(function(prev){
        var userAdded=prev.filter(function(p){return p.userAdded;});
        var withDist=allPlaces.map(function(p){return Object.assign({},p,{dist:+haversine(lat,lng,p.lat,p.lng).toFixed(1)});});
        return withDist.concat(userAdded);
      });
      setBusy(false);
      var remainingCats=cats.slice(3);
      for(var ri=0;ri<remainingCats.length;ri++){
        var morePlaces=await fetchNearbyPlaces(lat,lng,remainingCats[ri]);
        if(morePlaces.length>0){
          var localMore=morePlaces;
          setPL(function(prev){
            var ids=new Set(prev.map(function(x){return x.id;}));
            var newOnes=localMore.filter(function(x){return !ids.has(x.id);}).map(function(p){return Object.assign({},p,{dist:+haversine(lat,lng,p.lat,p.lng).toFixed(1)});});
            return prev.concat(newOnes);
          });
        }
      }
    }catch(e){setBusy(false);console.log('Load places error:',e);}
  };

          h("button",{onClick:()=>setStep(4),style:{width:'100%',padding:14,borderRadius:16,fontSize:14,fontWeight:700,background:'#16a34a',color:'white',border:'none',cursor:'pointer'}},t.bizReviewBtn)
        )
      ),
      // Step 4
      step===4&&h(React.Fragment,null,
        h(StepHdr,{s:4,title:t.bizReview,sub:t.bizReviewSub}),
        h("div",{style:{padding:14,overflowY:'auto',flex:1}},
          h("div",{style:{background:(CATS.find(c=>c.id===bizT)||{}).bg||'#16a34a',borderRadius:16,overflow:'hidden',marginBottom:14,boxShadow:'0 3px 10px rgba(0,0,0,.15)'}},
            h("div",{style:{padding:14}},
              h("div",{style:{display:'flex',alignItems:'center',gap:10,marginBottom:8}},
                h("div",{style:{width:44,height:44,background:'rgba(255,255,255,.2)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}},(CATS.find(c=>c.id===bizT)||{}).icon),
                h("div",null,
                  h("p",{style:{fontWeight:700,fontSize:15,color:'white',margin:0}},bizF.name||'Business Name'),
                  h("p",{style:{fontSize:12,color:'rgba(255,255,255,.75)',margin:0}},bizF.loc||'Location')
                )
              ),
              h("div",{style:{display:'flex',gap:7,flexWrap:'wrap'}},
                h("span",{style:{background:'rgba(255,255,255,.2)',padding:'3px 10px',borderRadius:8,fontSize:11,color:'white'}},"📞 ",bizF.phone||'—'),
                h("span",{style:{background:'rgba(255,255,255,.2)',padding:'3px 10px',borderRadius:8,fontSize:11,color:'white'}},"🕐 ",bizF.always?'24/7':`${oT}–${cT}`)
              )
            )
          ),
          [{ic:'🏷️',lk:'profName',v:bizF.name,s:2},{ic:'📞',lk:'profPhone',v:bizF.phone,s:2},{ic:'📍',lk:'profCity',v:bizF.loc,s:2},{ic:'🗺️',lk:'profCity',v:bizF.addr||'—',s:2},{ic:'✏️',lk:'profName',v:bizF.desc||'—',s:2},{ic:'🕐',lk:'hw',v:bizF.always?'24/7':`${oT}–${cT}`,s:3}].map((row,ri)=>h("div",{key:ri,style:{display:'flex',gap:10,padding:'10px 0',borderBottom:`1px solid ${D.border2}`}},
            h("span",{style:{fontSize:16,width:22,textAlign:'center',flexShrink:0}},row.ic),
            h("div",{style:{flex:1,minWidth:0}},
              h("p",{style:{fontSize:10,color:'#9ca3af',fontWeight:600,margin:'0 0 1px'}},t[row.lk]||row.lk),
              h("p",{style:{fontSize:13,color:D.text,fontWeight:500,margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},row.v||'—')
            ),
            h("button",{onClick:()=>setStep(row.s),style:{color:'#16a34a',fontSize:11,fontWeight:700,background:'transparent',border:'none',cursor:'pointer',flexShrink:0}},t.editBtn.replace('✏️ ',''))
          )),
          h("button",{onClick:submitBiz,style:{width:'100%',marginTop:16,padding:14,borderRadius:16,fontSize:14,fontWeight:700,background:'#16a34a',color:'white',border:'none',cursor:'pointer'}},t.bizSubmitBtn)
        )
      ),
      // Step 5 - success
      step===5&&h("div",{style:{padding:24,flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center'}},
        h("div",{style:{width:80,height:80,background:'#dcfce7',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}},
          h(Check,{size:44})
        ),
        h("p",{style:{fontSize:20,fontWeight:800,color:D.text,marginBottom:4}},t.bizSuccess),
        h("p",{style:{fontSize:13,color:'#6b7280',marginBottom:2}},h("b",{style:{color:D.text}},bizF.name)," ",t.bizSuccessS1('').trim()),
        h("p",{style:{fontSize:11,color:'#9ca3af',marginBottom:20}},t.bizSuccessS2),
        h("div",{style:{width:'100%',background:darkMode?'#243040':'#f9fafb',borderRadius:14,padding:14,border:`1px solid ${D.border2}`,textAlign:'left',marginBottom:20}},
          [['🏷️',bizF.name],['📞',bizF.phone],['📍',bizF.loc],['🕐',bizF.always?'24/7':`${oT}–${cT}`]].map(([ic,v])=>h("div",{key:ic,style:{display:'flex',gap:8,fontSize:12,color:D.text,marginBottom:5}},h("span",null,ic),h("span",null,v)))
        ),
        h("button",{onClick:()=>{setShowBiz(false);resetBiz();setTab('discover');},style:{width:'100%',padding:14,borderRadius:16,fontSize:14,fontWeight:700,background:'#16a34a',color:'white',border:'none',cursor:'pointer'}},t.bizDiscoverBtn)
      )
    )
  );

  // ── Overlays ──
  var PrivacyOverlay=h(Overlay,{show:showPr,onClose:()=>setShowPr(false),title:t.privacy,icon:"🛡️",col:"#ec4899",darkMode,okLabel:t.okBtn},
    t.privData.map(([hh,d],i)=>h("div",{key:i,style:{background:darkMode?'#1a1525':'#fdf2f8',borderRadius:10,padding:12,border:darkMode?'1px solid rgba(236,72,153,0.15)':'1px solid #fbcfe8',marginBottom:8}},
      h("p",{style:{fontWeight:700,fontSize:12,color:D.text,margin:'0 0 4px'}},hh),
      h("p",{style:{fontSize:11,color:'#9ca3af',lineHeight:1.6,margin:0}},d)
    ))
  );

  var HelpOverlay=h(Overlay,{show:showHl,onClose:()=>setShowHl(false),title:t.help,icon:"❓",col:"#0891b2",darkMode,okLabel:t.okBtn},
    t.helpData.map(([q,a],i)=>h("div",{key:i,style:{background:darkMode?'#0f1e25':'#ecfeff',borderRadius:10,padding:12,border:darkMode?'1px solid rgba(8,145,178,0.15)':'1px solid #a5f3fc',marginBottom:8}},
      h("div",{style:{display:'flex',alignItems:'flex-start',gap:6,marginBottom:4}},
        h("span",{style:{fontSize:12,color:'#0891b2',fontWeight:800,flexShrink:0}},"Q"),
        h("p",{style:{fontWeight:700,fontSize:12,color:D.text,margin:0}},q)
      ),
      h("div",{style:{display:'flex',alignItems:'flex-start',gap:6}},
        h("span",{style:{fontSize:12,color:'#9ca3af',fontWeight:700,flexShrink:0}},"A"),
        h("p",{style:{fontSize:11,color:'#9ca3af',lineHeight:1.6,margin:0}},a)
      )
    ))
  );

  var SignOutModal=showSO&&h("div",{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,padding:20},className:"aFI",onClick:()=>setShowSO(false)},
    h("div",{style:{background:darkMode?'#141824':D.card,borderRadius:20,padding:24,width:'100%',maxWidth:320,textAlign:'center'},className:"aSU",onClick:e=>e.stopPropagation()},
      h("div",{style:{fontSize:40,marginBottom:10}},"🚪"),
      h("p",{style:{fontWeight:700,fontSize:15,color:D.text,marginBottom:4}},t.signout,"?"),
      h("p",{style:{fontSize:12,color:'#9ca3af',marginBottom:18}},t.waqaiSignout),
      h("div",{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
        h("button",{onClick:()=>setShowSO(false),style:{padding:10,borderRadius:12,border:`1px solid ${D.border}`,fontSize:12,fontWeight:700,color:D.text,background:D.card,cursor:'pointer'}},t.cancelBtn),
        h("button",{onClick:handleSignout,style:{padding:10,borderRadius:12,background:'#ef4444',color:'white',fontSize:12,fontWeight:700,border:'none',cursor:'pointer'}},t.signout)
      )
    )
  );

  // ── Main render ──
  if(!splashDone) return h(Splash,{onDone:()=>{setSplashDone(true);document.body.style.background='#f8fafc';document.body.style.overflow='';}});   if(!user) return h(Auth,{onAuth:handleAuth,lang});
  return h("div",{
    style:{position:'fixed',inset:0,display:'flex',flexDirection:'column',overflow:'hidden',background:darkMode?'#0a0d16':D.bg,color:D.text,transition:'background .3s,color .3s'},
    className:[lang==='ur'?'ur-font':'',highContrast?'hc':''].filter(Boolean).join(' ')
  },
    h("div",{style:{flex:1,overflowX:'hidden',height:0,position:'relative'}},
      h("div",{ref:scrollRef,style:{position:'absolute',inset:0,overflowY:'auto',overflowX:'hidden',display:tab==='discover'?'block':'none'}},Discover),
      h("div",{style:{position:'absolute',inset:0,overflowY:'auto',overflowX:'hidden',display:tab==='browse'?'block':'none'}},Browse),
      h("div",{style:{position:'absolute',inset:0,overflowY:'auto',overflowX:'hidden',display:tab==='saved'?'block':'none'}},Saved),
      h("div",{ref:profScrollRef,style:{position:'absolute',inset:0,overflowY:'auto',overflowX:'hidden',display:tab==='profile'?'block':'none'}},Profile)
    ),
    // Bottom nav
    h("nav",{className:darkMode?'dm-nav':'',style:{flexShrink:0,background:darkMode?'transparent':D.card,borderTop:darkMode?'none':`1px solid ${D.border}`,boxShadow:darkMode?'none':'0 -2px 10px rgba(0,0,0,.06)',display:'flex',alignItems:'center',justifyContent:'space-around',padding:`8px 4px max(14px, env(safe-area-inset-bottom))`,position:'relative',zIndex:40}},
      [{k:'discover',ic:h(Compass,{size:22}),l:t.nDisc},{k:'browse',ic:h(Grid,{size:22}),l:t.nBrowse}].map(item=>h("button",{key:item.k,onClick:()=>setTab(item.k),style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 10px',background:'transparent',border:'none',cursor:'pointer',color:tab===item.k?'#16a34a':'#9ca3af',fontSize:10,fontWeight:600}},item.ic,item.l)),
      h("div",{style:{display:'flex',flexDirection:'column',alignItems:'center',marginTop:-20}},
        h("button",{onClick:()=>{resetBiz();setShowBiz(true);},className:darkMode?'dm-glow-green':'',style:{width:54,height:54,background:'linear-gradient(135deg,#22c55e,#15803d)',borderRadius:'50%',border:'4px solid '+(darkMode?'#080b14':'white'),display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:darkMode?'0 0 20px rgba(34,197,94,.4),0 3px 10px rgba(0,0,0,.5)':'0 -2px 14px rgba(34,197,94,.35),0 3px 10px rgba(0,0,0,.15)'}},
          h(Plus,{size:24,sw:2.8})
        ),
        h("span",{style:{fontSize:9,fontWeight:700,color:'#16a34a',marginTop:2}},t.listBtn)
      ),
      h("button",{onClick:()=>setTab('saved'),style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 10px',background:'transparent',border:'none',cursor:'pointer',color:tab==='saved'?'#16a34a':'#9ca3af',fontSize:10,fontWeight:600}},
        h("div",{style:{position:'relative'}},
          h(Heart,{size:22,color:tab==='saved'?'#16a34a':'#9ca3af'}),
          saved.size>0&&h("span",{style:{position:'absolute',top:-6,right:-6,width:15,height:15,background:'#ef4444',color:'white',borderRadius:'50%',fontSize:8,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}},saved.size>9?'9+':saved.size)
        ),
        t.nSaved
      ),
      h("button",{onClick:()=>{setTab('profile');setProfPage('main');},style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 10px',background:'transparent',border:'none',cursor:'pointer',color:tab==='profile'?'#16a34a':'#9ca3af',fontSize:10,fontWeight:600}},
        h(User,{size:22}),t.nProf
      )
    ),
    // Toast
    toast&&h("div",{style:{position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',background:'#111',color:'white',fontSize:12,fontWeight:600,padding:'8px 18px',borderRadius:24,boxShadow:'0 3px 12px rgba(0,0,0,.25)',zIndex:100,whiteSpace:'nowrap'},className:"aFI"},toast),
    popNotif&&h("div",{
      key:popNotif.id,
      onClick:()=>{setPopNotif(null);setTab('profile');setProfPage('notif');},
      style:{position:'fixed',top:12,left:12,right:12,zIndex:999,cursor:'pointer',animation:'slideInU .4s ease'}
    },
      h("div",{style:{
        background:darkMode?'#1e2438':'white',
        borderRadius:16,padding:'12px 14px',
        display:'flex',alignItems:'center',gap:12,
        boxShadow:'0 8px 32px rgba(0,0,0,.3)',
        border:'1px solid '+(darkMode?'rgba(255,255,255,.1)':'#e5e7eb')
      }},
        h("div",{style:{
          width:40,height:40,borderRadius:12,flexShrink:0,
          background:'#16a34a20',border:'1px solid #16a34a40',
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:20,animation:'bellRing .8s ease'
        }},(NOTIF_TYPES[popNotif.type]||{icon:'🔔'}).icon),
        h("div",{style:{flex:1,minWidth:0}},
          h("p",{style:{fontSize:13,fontWeight:700,color:darkMode?'#f0f4ff':'#111',margin:'0 0 2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},popNotif.title),
          h("p",{style:{fontSize:11,color:'#6b7280',margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},popNotif.body)
        ),
        h("button",{onClick:e=>{e.stopPropagation();setPopNotif(null);},style:{background:'transparent',border:'none',fontSize:16,color:'#9ca3af',cursor:'pointer',flexShrink:0}},"✕")
      )
    ),
    // Modals
    BizModal,PlaceModal,PrivacyOverlay,HelpOverlay,SignOutModal
  );
}

ReactDOM.render(h(App,null),document.getElementById('root'));
</script>
</body>
</html>
